<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CRAZY FLIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo" id="siteLogo">CRAZY<span>FLIP</span></div>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Search products..." />
  </div>
</header>

<!-- BANNER SLIDER -->
<section class="banner-slider" id="bannerSlider">
  <div class="banner-loading">Loading...</div>
</section>

<!-- PRODUCTS -->
<section class="products-section">
  <h2 class="section-title">OUR PRODUCTS</h2>
  <div class="products-grid" id="productsGrid">
    <div class="loading">Loading products...</div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <p id="footerName">CRAZY FLIP © 2026</p>
  <div id="footerLinks"></div>
</footer>

<!-- PRODUCT DETAILS POPUP -->
<div class="popup" id="productPopup">
  <div class="popup-box product-box">
    <button class="close-btn" data-close>&times;</button>
    <div class="product-detail">
      <img id="pdImage" src="" alt="">
      <div class="pd-info">
        <h2 id="pdName"></h2>
        <p id="pdDesc"></p>
        <h4>Choose Plan:</h4>
        <div class="plans" id="pdPlans"></div>
        <div class="pd-price">Total: <span id="pdPrice">GH₵ 0</span></div>
        <button class="btn-primary" id="buyNowBtn">BUY NOW</button>
      </div>
    </div>
  </div>
</div>

<!-- PAYMENT POPUP -->
<div class="popup" id="paymentPopup">
  <div class="popup-box payment-box">
    <button class="close-btn" data-close>&times;</button>
    <h2 class="pay-title">PAYMENT</h2>

    <div class="pay-info">
      <div class="pay-row"><span>Product</span><b id="payProduct"></b></div>
      <div class="pay-row"><span>Plan</span><b id="payPlan"></b></div>
      <div class="pay-row"><span>Total Price</span><b id="payPrice"></b></div>
      <div class="pay-row"><span>Method</span><b>Ghana Cedis (GHS)</b></div>
    </div>

    <div class="pay-box">
      <p id="payText">Send Money to the number below, then enter your details.</p>
      <div class="momo-row"><span>MoMo Number</span><b id="payMomo"></b>
        <button class="copy-btn" id="copyMomo">COPY</button>
      </div>
      <div class="momo-row"><span>Account Name</span><b id="payAcc"></b></div>
    </div>

    <div class="form-group">
      <label>Your WhatsApp Number</label>
      <input id="inpWhatsapp" type="text" placeholder="+233XXXXXXXXX" />
    </div>
    <div class="form-group">
      <label>Transaction ID</label>
      <input id="inpTxid" type="text" placeholder="TX123456" />
    </div>

    <div class="confirm-buttons">
      <button class="btn-whatsapp" id="btnWhatsapp">CONFIRM VIA WHATSAPP</button>
      <button class="btn-telegram" id="btnTelegram">CONFIRM VIA TELEGRAM</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script src="js/firebase-config.js"></script>
</body>
</html>
