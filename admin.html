<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — CRAZY FLIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-wrap">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="side-logo">CRAZY<span>FLIP</span></div>
    <nav>
      <button class="nav-btn active" data-tab="dashboard">📊 Dashboard</button>
      <button class="nav-btn" data-tab="orders">📦 Orders</button>
      <button class="nav-btn" data-tab="products">🛍️ Products</button>
      <button class="nav-btn" data-tab="banners">🖼️ Banner Manager</button>
      <button class="nav-btn" data-tab="payment">💳 Payment Settings</button>
      <button class="nav-btn" data-tab="settings">⚙️ Website Settings</button>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <!-- DASHBOARD -->
    <section class="tab active" id="tab-dashboard">
      <h1>Dashboard</h1>
      <div class="stats-grid">
        <div class="stat-card"><h3>Total Orders</h3><p id="stTotal">0</p></div>
        <div class="stat-card"><h3>Pending</h3><p id="stPending">0</p></div>
        <div class="stat-card"><h3>Completed</h3><p id="stCompleted">0</p></div>
        <div class="stat-card"><h3>Revenue (GH₵)</h3><p id="stRevenue">0</p></div>
      </div>
    </section>

    <!-- ORDERS -->
    <section class="tab" id="tab-orders">
      <h1>Orders</h1>
      <div id="ordersList" class="list"></div>
    </section>

    <!-- PRODUCTS -->
    <section class="tab" id="tab-products">
      <h1>Products</h1>
      <button class="add-btn" id="addProductBtn">+ ADD PRODUCT</button>
      <div id="productsList" class="list"></div>
    </section>

    <!-- BANNERS -->
    <section class="tab" id="tab-banners">
      <h1>Banner Manager</h1>
      <button class="add-btn" id="addBannerBtn">+ ADD BANNER</button>
      <div id="bannersList" class="list"></div>
    </section>

    <!-- PAYMENT SETTINGS -->
    <section class="tab" id="tab-payment">
      <h1>Payment Settings</h1>
      <div class="form-card">
        <label>MoMo Number</label>
        <input id="setMomo" type="text" />
        <label>Account Name</label>
        <input id="setAcc" type="text" />
        <label>Payment Text</label>
        <textarea id="setPayText" rows="3"></textarea>
        <button class="save-btn" id="savePayment">SAVE</button>
      </div>
    </section>

    <!-- WEBSITE SETTINGS -->
    <section class="tab" id="tab-settings">
      <h1>Website Settings</h1>
      <div class="form-card">
        <label>Website Name</label>
        <input id="setSiteName" type="text" />
        <label>Logo URL</label>
        <input id="setLogo" type="text" />
        <label>WhatsApp (Admin) +233...</label>
        <input id="setWhatsapp" type="text" />
        <label>Telegram Username (@ ছাড়া)</label>
        <input id="setTelegram" type="text" />
        <button class="save-btn" id="saveSite">SAVE</button>
      </div>
    </section>
  </main>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
<script src="js/firebase-config.js"></script>
</body>
</html>
