<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Website Settings — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-wrap">
  <div id="sidebar"></div>
  <main class="main">
    <h1>Website Settings</h1>
    <div class="form-card">
      <label>Website Name</label>
      <input id="setSiteName" type="text" />
      <label>Logo URL</label>
      <input id="setLogo" type="text" />
      <label>WhatsApp (Admin) +233...</label>
      <input id="setWhatsapp" type="text" />
      <label>Telegram Username (@ ছাড়া)</label>
      <input id="setTelegram" type="text" />
      <button class="save-btn" id="saveBtn">SAVE</button>
    </div>
  </main>
</div>

<script type="module">
  import { renderSidebar } from '../js/admin-shared.js';
  import { getSettings, saveSettings } from '../js/data.js';
  document.getElementById('sidebar').innerHTML = renderSidebar('settings');

  const s = await getSettings();
  document.getElementById('setSiteName').value = s.siteName || '';
  document.getElementById('setLogo').value = s.logo || '';
  document.getElementById('setWhatsapp').value = s.whatsapp || '';
  document.getElementById('setTelegram').value = s.telegram || '';

  document.getElementById('saveBtn').onclick = async () => {
    await saveSettings({
      siteName: document.getElementById('setSiteName').value.trim(),
      logo: document.getElementById('setLogo').value.trim(),
      whatsapp: document.getElementById('setWhatsapp').value.trim(),
      telegram: document.getElementById('setTelegram').value.trim()
    });
    alert('Saved!');
  };
</script>
</body>
</html>
